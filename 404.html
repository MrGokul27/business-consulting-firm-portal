<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Stackly Consulting</title>
    <!-- Favicon -->
    <link
      rel="shortcut icon"
      href="assets/images/logoStackly.webp"
      type="image/webp"
    />
    <!-- Bootstrap 5.3 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- FontAwesome 6.6.0 -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      rel="stylesheet"
    />
    <!-- Main Style CSS -->
    <link href="assets/css/styles.css" rel="stylesheet" />

    <!-- Custom 404 Styles -->
    <style>
      body {
        padding: 0;
      }
      .error-section {
        background-color: var(--dark-bg);
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .error-card {
        background: linear-gradient(
          135deg,
          rgba(0, 46, 79, 0.9) 0%,
          rgba(11, 26, 36, 0.95) 100%
        );
        border: 1px solid rgba(223, 202, 95, 0.15);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 3.5rem 2rem;
        box-shadow: var(--box-shadow-lg);
        max-width: 650px;
        width: 100%;
      }
      .error-code {
        font-size: 8rem;
        font-weight: 800;
        font-family: "Montserrat", sans-serif;
        color: var(--secondary-color);
        line-height: 1;
        margin-bottom: 1.5rem;
        text-shadow: 0 0 30px rgba(223, 202, 95, 0.25);
        letter-spacing: -2px;
      }
      .error-icon-box {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background-color: rgba(223, 202, 95, 0.1);
        color: var(--secondary-color);
        margin-bottom: 2rem;
        border: 1px solid rgba(223, 202, 95, 0.2);
        animation: pulse-ring 2s infinite ease-in-out;
      }
      @keyframes pulse-ring {
        0% {
          box-shadow: 0 0 0 0 rgba(223, 202, 95, 0.2);
        }
        70% {
          box-shadow: 0 0 0 15px rgba(223, 202, 95, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(223, 202, 95, 0);
        }
      }
      .animate-spin-slow {
        animation: spin 8s linear infinite;
      }
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .error-circle-bg-1 {
        position: absolute;
        top: -10%;
        left: -10%;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(223, 202, 95, 0.05) 0%,
          rgba(223, 202, 95, 0) 70%
        );
        pointer-events: none;
      }
      .error-circle-bg-2 {
        position: absolute;
        bottom: -10%;
        right: -10%;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(0, 46, 79, 0.3) 0%,
          rgba(0, 46, 79, 0) 70%
        );
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- MAIN 404 SECTION -->
    <section class="error-section">
      <div class="error-circle-bg-1"></div>
      <div class="error-circle-bg-2"></div>

      <div class="container position-relative z-1">
        <div class="row justify-content-center">
          <div class="col-lg-8 text-center">
            <div class="error-card mx-auto">
              <!-- Elegant Animated Icon Box -->
              <div class="error-icon-box">
                <i
                  class="fa-solid fa-compass-drafting fa-3x animate-spin-slow"
                ></i>
              </div>

              <!-- Big Bold 404 Code -->
              <div class="error-code">404</div>

              <!-- Error Headings & Copy -->
              <h2 class="text-white fw-bold mb-3">
                Strategic Course Correction Needed
              </h2>
              <p class="text-white-50 fs-6 mb-4 px-md-4">
                The corporate strategy, report, or resource page you requested
                is currently unavailable or has been relocated. Let's redirect
                your path back to growth.
              </p>

              <!-- Action Redirection Buttons -->
              <div
                class="d-flex flex-column flex-sm-row justify-content-center gap-3 mt-4"
              >
                <button
                  onclick="window.history.back()"
                  class="btn btn-outline-gold px-4 py-3 rounded-pill fw-bold text-uppercase tracking-wide"
                >
                  <i class="fa-solid fa-arrow-left me-2"></i>Go Back
                </button>
                <a
                  href="index.html"
                  class="btn btn-gold px-4 py-3 rounded-pill fw-bold text-uppercase tracking-wide"
                >
                  <i class="fa-solid fa-house me-2"></i>Return Home
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Bootstrap 5.3 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/script.js"></script>
  </body>
</html>
